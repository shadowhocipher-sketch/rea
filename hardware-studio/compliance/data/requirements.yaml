# 合规要求数据（唯一数据源）。map.md 由 build_map.py 从本文件生成，不要手改 map.md。
# 这是资料整理，不是法律意见。每条以官方原文和认证机构的意见为准。
#
# 字段说明见 build_map.py 顶部注释和 .claude/skills/compliance-map/SKILL.md。

meta:
  checked: "2026-11-01"
  method: >-
    2026-11-01 查询。本会话的网络策略拦截了所有官方站点的直接访问（WebFetch 报 ENOTFOUND，
    curl 经代理报 CONNECT 403），所以没有一条法规全文是直接打开读过的。
    核实方式是 WebSearch：搜索结果里出现官方域名页面（S/A 级），且搜索摘要引用该页面内容、
    与条目要点一致的，标"已核实"；只有第三方页面、来源互相冲突、适用范围拿不准的，标"待核实"。
    来源的 access 字段：search = 该 URL 出现在搜索结果里；pattern = 按官方网站的 URL 规则
    （如 EUR-Lex ELI、eCFR、legislation.gov.uk）拼出的原文地址，本次没有在搜索结果里看到，
    使用前请打开核对。

features:
  base: 基础（所有带电子电路的产品）
  wireless: 无线（Wi-Fi / BLE 等）
  connected: 联网（网络安全）
  lithium: 锂电池（可充电锂离子/锂聚合物）
  coin: 纽扣电池
  adapter: 随附电源适配器
  children: 儿童用（玩具/儿童产品）

markets:
  CN: 中国
  EU: 欧盟 CE
  US: 美国 FCC / CPSC
  UK: 英国 UKCA
  AU: 澳大利亚 RCM

evidence_types:
  self_declaration: 自我声明（制造商自测或委托测试后签发符合性声明）
  third_party_test: 第三方测试（指定或认可的实验室出报告）
  certification: 认证 / 型号核准（由认证机构或主管部门发证）
  registration: 注册 / 备案 / 生产者责任登记
  voluntary: 自愿项目
  general_duty: 一般安全义务（无固定证书，靠风险评估和技术文件）
  unknown: 未确定

requirements:

# ───────────────────────────── 中国 ─────────────────────────────

- id: CN-01
  market: CN
  features: [wireless]
  name: SRRC 无线电发射设备型号核准（2.4 GHz / 5 GHz Wi-Fi、蓝牙）
  instrument: 工信部《关于加强和规范2400MHz、5100MHz和5800MHz频段无线电管理有关事宜的通知》（工信部无〔2021〕129号）
  requirement: >-
    在 2400–2483.5 MHz、5150–5350 MHz、5725–5850 MHz 频段工作的蓝牙、无线局域网等设备，
    除微功率短距离设备外，应取得无线电发射设备型号核准证（SRRC），并满足通知附件的技术要求
    （第三方资料称新增了自适应等测试要求）。5100 MHz 频段限室内使用。
  applies_when: 产品含 Wi-Fi 或蓝牙等无线发射功能，在中国销售。
  trigger: {all: [wireless]}
  evidence: certification
  evidence_note: 向工信部无线电管理机构申请型号核准，样机需在指定检测机构测试。用已取得核准的模组时整机是否还要单独核准，待核实。
  sources:
    - {title: "工信部无〔2021〕129号 转载 PDF（TI E2E 论坛附件，非官方）", url: "https://e2e.ti.com/cfs-file/__key/communityserver-discussions-components-files/968/_E55DE14FE890E0651430_2021_1530_129_F7530A30E55D1A4E8C54E14F6F601653E89073518E4EA0523A5F8C54C4890383_2400MHz_0130_5100MHz_8C54_5800MHz_9198B56BE065BF7E3575A17B0674096773518B4E9C5B84761A90E5770B30_.pdf", level: C, kind: 原文转载, access: search}
    - {title: "In Compliance Magazine：MIIT 2021 No. 129 解读", url: "https://incompliancemag.com/chinas-latest-regulation-on-2-4-ghz-and-5-ghz-equipment/", level: C, kind: 第三方解读, access: search}
  checked: "2026-11-01"
  status: 待核实
  doubts: >-
    工信部官网原文页面本次未能定位（搜索摘要提到工信部页面的成文日期 2021-09-08、发布日期 2021-10-13，但没给出 URL）。
    实施和过渡期日期各来源不一致（2022-01-01 起施行、过渡期至 2023-10-15 / 两年）。
    使用已核准模组的整机是否需要单独核准，需要向检测机构确认。
  notes: 与 CN-02 一起看：蓝牙低功率设备是否可按微功率设备免核准，是本条最大的疑点。

- id: CN-02
  market: CN
  features: [wireless]
  name: 微功率短距离无线电发射设备目录和技术要求（免型号核准的边界）
  instrument: 工业和信息化部公告 2019 年第 52 号《微功率短距离无线电发射设备目录和技术要求》
  requirement: >-
    列入目录且符合技术要求的微功率设备，生产或进口后在国内销售和使用，无需取得无线电频率使用许可、
    无线电台执照和型号核准，但仍须符合产品质量等法律法规、国家标准和无线电管理规定。
  applies_when: 产品含无线发射功能，想判断能否按微功率设备免于型号核准（例如低功率 2.4 GHz 私有协议或 BLE）。
  trigger: {all: [wireless]}
  evidence: self_declaration
  evidence_note: 免核准不等于免要求：仍须满足目录中对应类别的频率、功率等技术指标，没有统一的证书。
  sources:
    - {title: "IT之家 转载公告全文", url: "https://www.ithome.com/0/459/757.htm", level: C, kind: 原文转载, access: search}
    - {title: "维基文库：微功率短距离无线电发射设备目录和技术要求", url: "https://zh.wikisource.org/wiki/%E5%BE%AE%E5%8A%9F%E7%8E%87%E7%9F%AD%E8%B7%9D%E7%A6%BB%E6%97%A0%E7%BA%BF%E7%94%B5%E5%8F%91%E5%B0%84%E8%AE%BE%E5%A4%87%E7%9B%AE%E5%BD%95%E5%92%8C%E6%8A%80%E6%9C%AF%E8%A6%81%E6%B1%82", level: C, kind: 原文转载, access: search}
  checked: "2026-11-01"
  status: 待核实
  doubts: >-
    工信部官网原文本次未能定位，只看到转载。目录 2.4 GHz 类别的具体功率限值本次没有读到原文；
    Wi-Fi / 蓝牙产品是否可以落入微功率类别（与 CN-01 的 129 号通知如何衔接）没把握，必须问检测机构。
  notes: 公告日期各来源写法不同（2019-11-19 附件 / 2019-11-28 生效）。

- id: CN-03
  market: CN
  features: [base]
  name: CCC 强制性产品认证（产品本体是否在目录内）
  instrument: 市场监管总局《强制性产品认证目录描述与界定表（2023年修订）》（2023 年第 36 号公告）及后续调整
  requirement: >-
    列入 CCC 目录的产品，未获得认证证书（或按规定完成自我声明）并加施 CCC 标志的，不得出厂、销售、进口。
    2023 年修订版共 16 大类 96 种产品，部分产品实行自我声明程序 A / B；2024 年后目录又有增补。
  applies_when: 任何在中国销售的电子产品都要先按《描述与界定表》判断本体是否属于目录产品（例如信息技术设备、音视频设备）。
  trigger: {all: [always]}
  evidence: certification
  evidence_note: 目录内产品由指定认证机构认证，或按目录标注走自我声明（报送系统 sdoc.cnca.cn）；目录外产品不需要 CCC。
  sources:
    - {title: "香港工业贸易署转载：强制性产品认证目录描述与界定表（2023年修订）公告", url: "https://www.tid.gov.hk/english/aboutus/tradecircular/cic/asia/2023/files/ci2023659a.pdf", level: A, kind: 官方转载, access: search}
    - {title: "汕头市政府文件（提到截至 2024 年底目录为 16 大类 105 种）", url: "https://www.shantou.gov.cn/attachment/0/135/135589/2446285.docx", level: A, kind: 地方政府文件, access: search}
  checked: "2026-11-01"
  status: 待核实
  doubts: >-
    认监委官网（cnca.gov.cn）原文附件本次无法访问，没有读到具体条目。USB 供电的小型桌面电子产品
    是否落入"信息技术设备""音视频设备"等目录类别，取决于产品功能和界定表的描述，必须让认证机构判断。
  notes: 产品本体不在目录内时，其随附的适配器（CN-04）、内置锂电池（CN-05）仍可能各自需要 CCC。

- id: CN-04
  market: CN
  features: [adapter]
  name: CCC：随附电源适配器 / 充电器
  instrument: 强制性产品认证目录（电源适配器类产品），实施规则 CNCA-C09-01:2023《强制性产品认证实施规则 电子产品及安全附件》
  requirement: 随产品销售的电源适配器 / 充电器如属于 CCC 目录产品，须有 CCC 证书并加施标志。
  applies_when: 产品包装内随附交流供电的电源适配器或充电器，在中国销售。
  trigger: {all: [adapter]}
  evidence: certification
  evidence_note: 通常直接采购已有 CCC 证书的适配器，并保存证书；自己设计适配器则需要认证。
  sources:
    - {title: "香港工业贸易署转载：CCC 目录描述与界定表（2023年修订）公告", url: "https://www.tid.gov.hk/english/aboutus/tradecircular/cic/asia/2023/files/ci2023659a.pdf", level: A, kind: 官方转载, access: search}
    - {title: "Raspberry Pi 27W 电源 CCC 证书（示例：按 CNCA-C09-01:2023 认证的适配器）", url: "https://pip.raspberrypi.com/categories/900-approvals/documents/RP-005300-CF/rpi-27W-PSU-China.pdf", level: C, kind: 企业证书示例, access: search}
  checked: "2026-11-01"
  status: 待核实
  doubts: 没有读到界定表中适配器条目的原文和适用电压/功率范围；目前的依据是厂商证书示例和转载公告。
  notes: 采购现成适配器时，核对证书上的型号与实物一致、证书有效。

- id: CN-05
  market: CN
  features: [lithium]
  name: CCC：锂离子电池和电池组（GB 31241）
  instrument: 市场监管总局 2023 年公告（对锂离子电池和电池组、移动电源实施 CCC 管理）；国家标准 GB 31241-2022；实施规则 CNCA-C09-01:2023
  requirement: >-
    自 2023-08-01 起对便携式电子产品用锂离子电池和电池组、移动电源实施 CCC 管理；
    自 2024-08-01 起，未获 CCC 证书和未标注认证标志的，不得出厂、销售、进口或在其他经营活动中使用。
    锂离子电池和电池组依据 GB 31241。
  applies_when: 产品内置可充电锂离子 / 锂聚合物电池（便携式电子产品用），在中国销售。
  trigger: {any: [lithium]}
  evidence: certification
  evidence_note: 电池（或电池组）由指定认证机构认证；整机厂通常采购已获 CCC 的电芯/电池组并保存证书。
  sources:
    - {title: "香港工业贸易署转载：市场监管总局关于对锂离子电池等产品实施 CCC 管理的公告（2023）", url: "https://www.tid.gov.hk/english/aboutus/tradecircular/cic/asia/2023/files/ci2023409a.pdf", level: A, kind: 官方转载, access: search}
    - {title: "人民网：8月起对锂电池实施CCC认证（2023-07-31）", url: "https://paper.people.com.cn/zgnybwap/html/2023-07/31/content_26009869.htm", level: C, kind: 媒体报道, access: search}
  checked: "2026-11-01"
  status: 待核实
  doubts: >-
    市场监管总局官网原文本次无法访问；公告文号和发布日期各来源不一致（3 月 / 7 月，"第10号"）。
    内置于整机中的电池是否必须单独持有 CCC 证书（还是只对单独销售的电池），以及小容量电池是否有豁免，没有读到原文条款。
  notes: 2026 年工信部公示了《移动电源安全技术规范》强制性国家标准报批稿（第三方报道），只影响移动电源（充电宝）类产品。

- id: CN-06
  market: CN
  features: [children]
  name: CCC：玩具（含电玩具），新版实施规则 CNCA-C22-02:2026
  instrument: 国家认监委 2026 年第 8 号公告；《强制性产品认证实施规则 玩具》CNCA-C22-02:2026；GB 6675 系列（2025 版，第三方资料）
  requirement: >-
    属于 CCC 目录的玩具须取得 CCC 证书。2026-11-01 起，CCC 认证活动应当按新版实施规则开展；
    已颁发的有效证书可继续使用，通过变更、到期换证等方式逐步转换。
  applies_when: 产品面向儿童、属于玩具（第三方资料称适用于面向 14 岁以下儿童的电玩具、塑胶玩具、金属玩具、弹射玩具等目录类别）。
  trigger: {all: [children]}
  evidence: certification
  evidence_note: 由指定认证机构按实施规则做型式试验 + 工厂检查，发 CCC 证书。
  sources:
    - {title: "香港工业贸易署转载：国家认监委关于发布电动自行车、童车、玩具 CCC 实施规则的公告（2026）", url: "https://www.tid.gov.hk/en/tradecircular/files/2026/ci4972026a.pdf", level: A, kind: 官方转载, access: search}
    - {title: "STC：New CCC Implementation Rules for Electric Bicycles, Toys, and Children's Vehicle Products", url: "https://stc.group/en/media/detail/2380", level: C, kind: 第三方解读, access: search}
  checked: "2026-11-01"
  status: 已核实
  doubts: 公告日期两个来源写法不同（2026-05-29 / 2026-05-31）；产品是否属于"玩具"目录类别需按界定表判断；新版 GB 6675 的版本号仅来自第三方。
  notes: 今天（2026-11-01）正好是新规则强制执行日，新申请按新规则做。

- id: CN-07
  market: CN
  features: [base]
  name: 中国 RoHS：电器电子产品有害物质限制使用
  instrument: 《电器电子产品有害物质限制使用管理办法》；《电器电子产品有害物质限制使用达标管理目录（2026年版）》；GB 26572—2025（2027-08-01 实施）
  requirement: >-
    电器电子产品须按标准标注有害物质信息（RoHS 标识、信息披露）；列入达标管理目录的产品还须满足限量要求并纳入合格评定。
    2026 年版目录共 33 种产品，新增产品管控要求 2027-08-01 起实施。
  applies_when: 所有在中国销售的电器电子产品（标识义务）；是否属于达标管理目录的 33 种产品需单独判断。
  trigger: {all: [always]}
  evidence: self_declaration
  evidence_note: 标识和信息披露由企业自行完成；目录内产品的合格评定方式（自我声明或认证）待核实。
  sources:
    - {title: "国家科技传播中心网站：达标管理目录（2026年版）相关公告", url: "https://www.ncsti.gov.cn/kjdt/tzgg/202605/t20260528_248133.html", level: A, kind: 政府网站转载, access: search}
    - {title: "ChemLinked：达标管理目录（2026 版）英文翻译", url: "https://chemical.chemlinked.com/translation/qualification-management-catalogue-for-the-restriction-of-hazardous-substances-in-electrical-appliances-and-electronic-products-2026-version", level: C, kind: 第三方翻译, access: search}
  checked: "2026-11-01"
  status: 待核实
  doubts: >-
    工信部原文和目录附件本次无法访问，33 种产品的具体名单没有读到（第三方称新增智能手环等）；
    旧标准 SJ/T 11364、GB/T 26572-2011 与 GB 26572—2025 的过渡安排没查到官方说明。
  notes: 物料选型时就要求供应商提供符合限量要求的声明或检测报告，省得后面补。

- id: CN-08
  market: CN
  features: [coin]
  name: 纽扣电池：未查到中国针对"含纽扣电池产品"的专门强制要求
  instrument: 未查到
  requirement: >-
    本次没有找到中国市场监管总局发布的、针对含纽扣电池产品防误吞（电池仓固定、警示标签等）的专门强制性国家标准。
    玩具类产品的电池要求在玩具 CCC（CN-06）所用的 GB 6675 / 电玩具标准中。
  applies_when: 产品使用纽扣/硬币电池，在中国销售。
  trigger: {any: [coin]}
  evidence: unknown
  evidence_note: 未查到。
  sources:
    - {title: "国家标准全文公开系统（建议在此按'纽扣电池'检索）", url: "https://openstd.samr.gov.cn/", level: S, kind: 检索入口, access: search}
  checked: "2026-11-01"
  status: 待核实
  doubts: 查过：WebSearch 中文检索"纽扣电池 强制性国家标准 儿童 误吞"，结果只有澳大利亚和美国的资料。不能据此认为中国没有要求，需要认证机构确认。
  notes: 即便没有专门要求，也建议参照 AU-05 / US-05 的做法设计电池仓（螺丝固定）和警示。

- id: CN-09
  market: CN
  features: [connected]
  name: 联网设备：个人信息保护；未查到消费类物联网网络安全强制标准
  instrument: 《中华人民共和国个人信息保护法》（2021-11-01 施行）
  requirement: >-
    设备或配套 App 处理个人信息时，适用个人信息保护法（告知同意、最小必要等处理规则和处理者义务）。
    本次没有找到类似英国 PSTI、澳洲智能设备规则那样针对消费类联网设备的强制性网络安全国家标准。
  applies_when: 产品联网（直接或经手机 App），并收集、处理用户个人信息。
  trigger: {any: [connected]}
  evidence: general_duty
  evidence_note: 个人信息保护属于运营义务（隐私政策、同意机制、安全措施），没有产品证书。
  sources:
    - {title: "国家互联网信息办公室：中华人民共和国个人信息保护法（全文）", url: "https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm", level: S, kind: 法律原文, access: search}
  checked: "2026-11-01"
  status: 待核实
